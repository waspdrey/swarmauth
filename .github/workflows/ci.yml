name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # [dev,redis] so mypy can resolve swarmauth.backends.redis_backend
      # against the real redis-py types, not just the TYPE_CHECKING stub name.
      - name: Install swarmauth (dev + redis)
        run: pip install -e ".[dev,redis]"

      - name: Ruff (lint)
        run: ruff check swarmauth tests

      - name: Mypy (strict, library code only)
        run: mypy swarmauth

      - name: pip-audit (known vulnerabilities in resolved dependencies)
        run: python scripts/audit_deps.py

      - name: Verify committed protocol vectors are reproducible
        run: |
          python scripts/generate_test_vectors.py
          git diff --exit-code -- spec/test-vectors/vectors.json

      - name: Version sync (pyproject.toml must match swarmauth/__init__.py)
        run: |
          python -c "
          import re, sys, tomllib
          pyproject_version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          init_version = re.search(r'__version__ = \"([^\"]+)\"', open('swarmauth/__init__.py').read()).group(1)
          if pyproject_version != init_version:
              sys.exit(f'version mismatch: pyproject.toml={pyproject_version!r} swarmauth/__init__.py={init_version!r}')
          import json
          js_version = json.load(open('js/package.json'))['version']
          if js_version != pyproject_version:
              sys.exit(f'JavaScript version mismatch: {js_version} != {pyproject_version}')
          print(f'versions match: {pyproject_version}')
          "

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install swarmauth (core + dev)
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -v

      - name: Run execution-boundary example
        run: python examples/execution_boundary.py

      - name: Run Marrow procurement example
        run: python examples/marrow_procurement.py

      - name: Run shared currency budget example
        run: python examples/task_budgets.py

      - name: Run SwarmBench (smoke test)
        run: python benchmarks/swarmbench.py

  framework-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install swarmauth + framework adapter dependencies
        run: pip install -e ".[dev,frameworks]"

      - name: Run framework adapter integration tests
        run: pytest -v tests/test_framework_adapters.py tests/test_production_controls.py

  # Validates the TypeScript reference implementation (ts/) against the same
  # spec/test-vectors/vectors.json the Python SDK enforces itself against in
  # the `test` job above -- both passing against one file is what makes them
  # interoperable by construction, not by inspection.
  typescript-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and run conformance tests
        run: npm test

  # tests/test_redis_backend.py runs against fakeredis in the main `test` job
  # above (no real server needed). This job re-runs the same tests against an
  # actual Redis server, since fakeredis's wire-protocol emulation, however
  # faithful, is not a substitute for the real thing.
  redis-backend-live:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install swarmauth + redis dependencies
        run: pip install -e ".[dev,redis]"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node SDK development dependencies
        working-directory: js
        run: npm ci

      - name: Test native async Node Redis enforcement
        working-directory: js
        env:
          SWARMAUTH_TEST_REDIS_URL: redis://localhost:6379/0
        run: npm test

      - name: Run Redis backend tests against a real Redis server
        env:
          SWARMAUTH_TEST_REDIS_URL: redis://localhost:6379/0
        run: pytest -v tests/test_redis_backend.py tests/test_enforcement.py tests/test_redis_interop.py tests/test_production_controls.py

  javascript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "22", "24"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Node SDK development dependencies
        working-directory: js
        run: npm ci

      - name: Test the JavaScript SDK against spec/test-vectors
        working-directory: js
        run: npm test

  go-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"
          cache: false
      - name: Verify formatting
        run: |
          gofmt -w .
          git diff --exit-code
      - name: Verify protocol conformance and concurrent enforcement
        run: go test -race ./...
      - name: Vet
        run: go vet ./...

  release-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distribution artifacts
        run: |
          pip install build
          python -m build
      - name: Test the installed wheel outside the checkout
        run: python scripts/verify_release_artifact.py
