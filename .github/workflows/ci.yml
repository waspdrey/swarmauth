name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # [dev,redis] so mypy can resolve swarmauth.backends.redis_backend
      # against the real redis-py types, not just the TYPE_CHECKING stub name.
      - name: Install swarmauth (dev + redis)
        run: pip install -e ".[dev,redis]"

      - name: Ruff (lint)
        run: ruff check swarmauth tests

      - name: Mypy (strict, library code only)
        run: mypy swarmauth

      - name: pip-audit (known vulnerabilities in resolved dependencies)
        run: python scripts/audit_deps.py

      - name: Version sync (pyproject.toml must match swarmauth/__init__.py)
        run: |
          python -c "
          import re, sys, tomllib
          pyproject_version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          init_version = re.search(r'__version__ = \"([^\"]+)\"', open('swarmauth/__init__.py').read()).group(1)
          if pyproject_version != init_version:
              sys.exit(f'version mismatch: pyproject.toml={pyproject_version!r} swarmauth/__init__.py={init_version!r}')
          print(f'versions match: {pyproject_version}')
          "

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install swarmauth (core + dev)
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -v

      - name: Run SwarmBench (smoke test)
        run: python benchmarks/swarmbench.py

  framework-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install swarmauth + framework adapter dependencies
        run: pip install -e ".[dev,frameworks]"

      - name: Run framework adapter integration tests
        run: pytest -v tests/test_framework_adapters.py

  # tests/test_redis_backend.py runs against fakeredis in the main `test` job
  # above (no real server needed). This job re-runs the same tests against an
  # actual Redis server, since fakeredis's wire-protocol emulation, however
  # faithful, is not a substitute for the real thing.
  redis-backend-live:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install swarmauth + redis dependencies
        run: pip install -e ".[dev,redis]"

      - name: Run Redis backend tests against a real Redis server
        env:
          SWARMAUTH_TEST_REDIS_URL: redis://localhost:6379/0
        run: pytest -v tests/test_redis_backend.py
