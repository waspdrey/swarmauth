name: Deploy SwarmAuth site to GitHub Pages

# docs/index.html fetches README.md at runtime and renders it client-side
# (marked.js + mermaid.js, pinned versions with SRI). This workflow's only
# job assembles README.md and SPEC.md fresh from main on every deploy, so the
# rendered README and its protocol links stay in sync with the repository.

on:
  push:
    branches: [main]
    paths:
      - "SPEC.md"
      - "README.md"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          cp docs/.nojekyll _site/.nojekyll
          cp README.md _site/README.md
          cp SPEC.md _site/SPEC.md

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
