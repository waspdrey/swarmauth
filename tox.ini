[tox]
env_list = py310, py311, py312, py313, lint
skip_missing_interpreters = true

[testenv]
description = Run the core test suite (matches CI's `test` job)
extras = dev
commands = pytest -v {posargs}

[testenv:frameworks]
description = Run framework adapter integration tests against real LangChain/ag2/MCP installs (matches CI's `framework-adapters` job)
extras = dev,frameworks
commands = pytest -v tests/test_framework_adapters.py {posargs}

[testenv:redis-live]
description = Run Redis backend tests against a real server instead of fakeredis (matches CI's `redis-backend-live` job). Requires SWARMAUTH_TEST_REDIS_URL, e.g. redis://localhost:6379/0
extras = dev,redis
passenv = SWARMAUTH_TEST_REDIS_URL
commands = pytest -v tests/test_redis_backend.py {posargs}

[testenv:lint]
description = Ruff, mypy (strict), and pip-audit (matches CI's `lint` job)
extras = dev,redis
commands =
    ruff check swarmauth tests
    mypy swarmauth
    python scripts/audit_deps.py

[testenv:release-check]
description = Build a wheel and run the full suite against IT (not the repo) -- required before tagging a release, see CONTRIBUTING.md
skip_install = true
deps = build
allowlist_externals = rm
commands =
    rm -rf dist build swarmauth.egg-info
    python -m build
    python scripts/verify_release_artifact.py
