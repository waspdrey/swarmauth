<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SwarmAuth Protocol Specification</title>
<meta name="description" content="SwarmAuth: a compact, signed Capability Token (JCT) format and verification protocol for agent-to-agent and agent-to-tool authorization." />
<link rel="icon" href="data:,">
<style>
  :root {
    --fg: #1a1a1a;
    --bg: #ffffff;
    --muted: #5b6270;
    --border: #e2e5ea;
    --code-bg: #f4f6f8;
    --accent: #2f6fed;
    --max-width: 860px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #e8eaed;
      --bg: #14161a;
      --muted: #9aa2b1;
      --border: #2b2f38;
      --code-bg: #1c1f26;
      --accent: #7aa2ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header {
    border-bottom: 1px solid var(--border);
    padding: 24px 16px;
  }
  header .inner {
    max-width: var(--max-width);
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 20px;
    align-items: baseline;
  }
  header h1 { font-size: 18px; margin: 0; }
  header nav a { color: var(--muted); text-decoration: none; font-size: 14px; margin-right: 16px; }
  header nav a:hover { color: var(--accent); }
  main {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 32px 16px 96px;
  }
  #content h1 { font-size: 1.9em; margin-top: 0; }
  #content h2 { border-top: 1px solid var(--border); padding-top: 28px; margin-top: 40px; }
  #content h3 { margin-top: 28px; }
  #content a { color: var(--accent); }
  #content code { background: var(--code-bg); padding: 0.15em 0.4em; border-radius: 4px; font-size: 0.9em; }
  #content pre { background: var(--code-bg); padding: 14px 16px; border-radius: 8px; overflow-x: auto; }
  #content pre code { background: none; padding: 0; }
  #content table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: 0.92em; }
  #content th, #content td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
  #content th { background: var(--code-bg); }
  #content blockquote { border-left: 3px solid var(--accent); margin: 1em 0; padding: 0.2em 1em; color: var(--muted); }
  .mermaid { background: var(--code-bg); border-radius: 8px; padding: 16px; }
  .loading, .error { color: var(--muted); padding: 40px 0; }
  .error { color: #d14343; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 16px 48px; }
</style>
</head>
<body>
<header>
  <div class="inner">
    <h1>SwarmAuth Protocol</h1>
    <nav>
      <a href="https://github.com/waspdrey/swarmauth">GitHub</a>
      <a href="https://pypi.org/project/swarmauth/">PyPI</a>
      <a href="https://github.com/waspdrey/swarmauth/tree/main/spec/test-vectors">Test vectors</a>
      <a href="https://github.com/waspdrey/swarmauth/tree/main/ts">TypeScript SDK</a>
    </nav>
  </div>
</header>
<main>
  <div id="content"><p class="loading">Loading spec…</p></div>
</main>
<footer>
  Rendered from <a href="https://github.com/waspdrey/swarmauth/blob/main/SPEC.md">SPEC.md</a> in the SwarmAuth repository.
  This page has no build step: it fetches that file directly and renders it client-side, so it can never drift out of sync.
</footer>

<script
  src="https://cdn.jsdelivr.net/npm/marked@18.0.13/lib/marked.umd.js"
  integrity="sha384-Jy8qDMspJASzATgFngF2ompIKy0StbCcvuTE65mxDm/E0/YSIF6Ndc+5V7bbwRcw"
  crossorigin="anonymous"></script>
<script
  src="https://cdn.jsdelivr.net/npm/mermaid@12.0.0/dist/mermaid.min.js"
  integrity="sha384-xzghz1GQ5u9HCpVskeDPqMsdogD1yvuMQbEK53+wi+G70+6J1AG0L2cfi9PHjDWI"
  crossorigin="anonymous"></script>
<script>
(async () => {
  const contentEl = document.getElementById("content");
  try {
    const res = await fetch("./spec.md", { cache: "no-store" });
    if (!res.ok) throw new Error(`fetch failed: ${res.status}`);
    const markdown = await res.text();

    marked.use({ gfm: true, breaks: false });
    contentEl.innerHTML = marked.parse(markdown);

    // marked renders a fenced ```mermaid block as <pre><code class="language-mermaid">;
    // mermaid.js only auto-discovers <pre class="mermaid"> or <div class="mermaid">, so
    // convert explicitly before initializing.
    document.querySelectorAll("code.language-mermaid").forEach((codeEl) => {
      const pre = codeEl.parentElement;
      const div = document.createElement("div");
      div.className = "mermaid";
      div.textContent = codeEl.textContent;
      pre.replaceWith(div);
    });

    // marked's core no longer assigns heading ids (that moved to a separate
    // extension we're not pulling in), but README.md and SPEC.md's own
    // cross-references (e.g. "SPEC.md#8-key-registry-and-rotation") assume
    // GitHub's slug convention. Reproduce it so those links work here too:
    // lowercase, strip characters that aren't word chars/spaces/hyphens,
    // spaces to hyphens, de-duplicate repeats with a trailing -1, -2, ...
    const usedSlugs = new Map();
    contentEl.querySelectorAll("h1, h2, h3, h4, h5, h6").forEach((heading) => {
      let slug = heading.textContent
        .toLowerCase()
        .trim()
        .replace(/[^\w\s-]/g, "")
        .replace(/\s+/g, "-");
      const count = usedSlugs.get(slug) ?? 0;
      usedSlugs.set(slug, count + 1);
      heading.id = count === 0 ? slug : `${slug}-${count}`;
    });

    mermaid.initialize({ startOnLoad: false, theme: matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "default" });
    await mermaid.run({ querySelector: ".mermaid" });

    if (location.hash) {
      const target = document.getElementById(location.hash.slice(1));
      // Double rAF: waits for layout to fully settle after the DOM changes
      // above before scrolling, so a late reflow (or the browser's own
      // pending fragment-scroll from initial navigation, before this
      // heading existed) can't override where we land.
      requestAnimationFrame(() => requestAnimationFrame(() => target?.scrollIntoView()));
    }
  } catch (err) {
    contentEl.innerHTML = `<p class="error">Failed to load SPEC.md: ${String(err)}. Read it directly on <a href="https://github.com/waspdrey/swarmauth/blob/main/SPEC.md">GitHub</a> instead.</p>`;
  }
})();
</script>
</body>
</html>
